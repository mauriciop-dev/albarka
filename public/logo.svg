<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Albarka S.A.S. - Consultoría en Dirección de Proyectos y Transformación Organizacional">
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stopColor="#0F2C59" />
      <stop offset="50%" stopColor="#00A88F" />
      <stop offset="100%" stopColor="#00B4D8" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stopColor="#0F2C59" />
      <stop offset="100%" stopColor="#00A88F" />
    </linearGradient>
  </defs>

  <!-- Isotipo - Abstract arrow/transformation symbol -->
  <g transform="translate(10, 10)">
    <!-- Background circle -->
    <circle cx="35" cy="35" r="35" fill="url(#iconGradient)" opacity="0.15" />
    <!-- Arrow pointing up-right - transformation -->
    <path
      d="M35 12 L35 45 M20 30 L35 15 L50 30"
      stroke="url(#logoGradient)"
      strokeWidth="3.5"
      strokeLinecap="round"
      strokeLinejoin="round"
    />
    <!-- Three dots representing People, Process, Technology -->
    <circle cx="20" cy="52" r="3" fill="#0F2C59" opacity="0.6" />
    <circle cx="35" cy="52" r="3" fill="#00A88F" />
    <circle cx="50" cy="52" r="3" fill="#00B4D8" opacity="0.6" />
  </g>

  <!-- Logotipo - Text -->
  <g transform="translate(100, 0)">
    <!-- ALBARKA -->
    <text
      x="0"
      y="52"
      fontFamily="Montserrat, system-ui, sans-serif"
      fontSize="36"
      fontWeight="800"
      letterSpacing="-0.02em"
      fill="#0F2C59"
    >
      ALBARKA
    </text>
    <!-- S.A.S. -->
    <text
      x="0"
      y="74"
      fontFamily="Montserrat, system-ui, sans-serif"
      fontSize="11"
      fontWeight="600"
      letterSpacing="0.15em"
      fill="#2B2D42"
      textTransform="uppercase"
    >
      S.A.S.
    </text>
    <!-- Tagline -->
    <text
      x="0"
      y="90"
      fontFamily="Inter, system-ui, sans-serif"
      fontSize="9"
      fontWeight="400"
      letterSpacing="0.05em"
      fill="#6B6E85"
      textTransform="uppercase"
    >
      Dirección de Proyectos · Transformación Organizacional
    </text>
  </g>

  <!-- Decorative line -->
  <line
    x1="100"
    y1="58"
    x2="220"
    y2="58"
    stroke="url(#logoGradient)"
    strokeWidth="2"
    strokeLinecap="round"
    opacity="0.5"
  />
</svg>